# Genera la web (ADR 0006) i la desplega a Vercel. S'executa:
#   - sol, després de cada actualització setmanal de dades que acabi bé, perquè les xifres
#     publicades es mantinguin al dia;
#   - a mà (Actions → Web → Run workflow), per publicar canvis de disseny o de textos.
# Els push NO la despleguen: els canvis es revisen en local i es publiquen quan es decideix.
#
# El desplegament només s'executa si la variable del repositori PUBLICAR_WEB val "true"
# (Settings → Secrets and variables → Actions → Variables) i hi ha els secrets VERCEL_TOKEN,
# VERCEL_ORG_ID i VERCEL_PROJECT_ID. Sense això, el web queda com a artefacte "web" de
# l'execució, descarregable des de la pestanya Actions.
name: Web

on:
  workflow_run:
    workflows: ["Actualització setmanal"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: web
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  construir:
    # Després d'una actualització setmanal fallida no es publica res
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Recupera les instantànies i reconstrueix la base de dades
        run: |
          uv run viatges pull
          uv run viatges build

      - name: Genera el web
        run: uv run viatges web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: site

      - name: Desplega a Vercel
        if: vars.PUBLICAR_WEB == 'true'
        # Format "prebuilt": Vercel rep els fitxers ja generats i no intenta construir res
        # (si no, detecta pyproject.toml i espera una aplicació Python).
        run: |
          mkdir -p .vercel/output
          cp -R site .vercel/output/static
          echo '{"version": 3}' > .vercel/output/config.json
          npx --yes vercel@latest deploy --prebuilt --archive=tgz --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
